# Local / demo stack: the app plus an optional nginx reverse proxy.
#
#   docker compose up -d --build              # app on http://localhost:8000
#   docker compose --profile proxy up -d      # adds nginx on http://localhost:8080
#
# No database service is required: the app seeds demo data in memory at start.

name: campus-helpdesk

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-local}
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ${IMAGE:-campus-helpdesk:local}
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      ENVIRONMENT: production
      # Served over plain HTTP locally; set to 1 behind TLS.
      SESSION_COOKIE_SECURE: "0"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-helpdesk123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
