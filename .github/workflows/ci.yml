name: CI

# Continuous Integration: every push and pull request is linted, tested on
# three Python versions, security-scanned and container-built before it can
# merge. No deployment happens here — that is cd.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ---------------------------------------------------------------------
  # 1. Static analysis — fastest job, runs first so a style error fails
  #    the pipeline before the test matrix spins up.
  # ---------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------
  # 2. Test matrix — unit, API and view tests with a coverage gate.
  # ---------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            --junitxml=reports/junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/
          retention-days: 7

  # ---------------------------------------------------------------------
  # 3. Security — dependency audit, SAST and a filesystem vulnerability scan.
  # ---------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install scanners
        run: |
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: Static analysis (bandit)
        run: bandit -r app -ll -x tests

      - name: Filesystem scan (Trivy)
        run: |
          docker run --rm -v "$PWD:/scan" \
            aquasec/trivy:0.76.2 fs \
            --format sarif --output /scan/trivy-fs.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed /scan

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif

  # ---------------------------------------------------------------------
  # 4. Container — build the image, boot it, run the smoke test, scan it.
  # ---------------------------------------------------------------------
  docker:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: campus-helpdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=0.0.0-ci
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

      - name: Show image size
        run: docker image ls campus-helpdesk:ci

      - name: Start container
        run: |
          docker run -d --name helpdesk \
            -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test \
            -e SESSION_COOKIE_SECURE=0 \
            campus-helpdesk:ci

      - name: Smoke test the running container
        run: BASE_URL=http://127.0.0.1:8000 bash ./scripts/smoke_test.sh

      - name: Container logs on failure
        if: failure()
        run: docker logs helpdesk

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            campus-helpdesk:ci


      - name: Stop container
        if: always()
        run: docker rm -f helpdesk || true
