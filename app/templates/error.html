<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · Campus IT Helpdesk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="error-card">
    <p class="error-code">{{ code }}</p>
    <h1>{{ message }}</h1>
    <p class="muted">If this keeps happening, contact the IT desk with the request ID shown in the response headers.</p>
    <a class="btn btn-primary" href="{{ url_for('views.index') }}">Back to dashboard</a>
  </div>
</body>
</html>
